<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siklus Produksi · PT. Katalis Lintas Global</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500&display=swap">
<style>
:root{
  --bg:#f5f8fa;--surface:#fff;--ink:#0f2433;--muted:#5a6f7d;--line:#d9e3ea;
  --laut:#0a6b9e;--laut-muda:#e3f0f7;--naik:#1f7a4d;--turun:#b4442f;--turun-muda:#f8e7e3;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"IBM Plex Serif",Georgia,serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#08151e;--surface:#0f2130;--ink:#e4edf3;--muted:#93a8b6;--line:#20384a;
  --laut:#4fb0e3;--laut-muda:#123047;--naik:#5cc48f;--turun:#ec8a74;--turun-muda:#3a1e19;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans)}
a{color:var(--laut)}
.pita{background:linear-gradient(135deg,#06324d,#0a6b9e);color:#fff;padding-inline:16px}
.pita-isi{max-width:960px;margin:0 auto;padding-block:24px 44px}
.pita img{height:40px;display:block}
.pita nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:24px}
.pita nav a{color:#fff;text-decoration:none;font:500 13px/1 var(--mono);padding:8px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.35)}
.pita nav a[aria-current="page"]{background:#fff;color:#06324d;border-color:#fff}
.label{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.8;margin:28px 0 10px}
h1{font:500 clamp(28px,5vw,40px)/1.15 var(--serif);margin:0;text-wrap:balance}
.pita p.lead{max-width:62ch;margin:12px 0 0;opacity:.88}
main{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:0 64px;display:flex;flex-direction:column;gap:48px}
section{display:flex;flex-direction:column;gap:16px;min-width:0}
h2{font:600 21px/1.3 var(--sans);margin:0;text-wrap:balance}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--laut);margin:0}
.muted{color:var(--muted)}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:-28px}
.kpi div{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .k,.kpi .s{font-size:13px;color:var(--muted)}
.kpi .v{font:500 23px/1.2 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.v.naik{color:var(--naik)}.v.turun,.turun{color:var(--turun)}
@media (max-width:760px){.kpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.kpi{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.gulir{overflow-x:auto;position:relative}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--muted);text-align:left;font-size:13px;border-bottom:1px solid var(--line);padding:8px 10px;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.total td{font-weight:600;border-bottom:none;border-top:1.5px solid var(--ink)}
tr.tautan{cursor:pointer}tr.tautan:hover td{background:var(--laut-muda)}
.hbar{display:flex;flex-direction:column;gap:8px}
.hbar .row{display:grid;grid-template-columns:90px minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:14px}
.hbar .trak{position:relative;height:16px;background:var(--laut-muda);border-radius:3px}
.hbar .isi{position:absolute;top:0;bottom:0;background:var(--laut);border-radius:3px}
.hbar .isi.neg{background:var(--turun)}
.hbar .nol{position:absolute;top:-3px;bottom:-3px;border-left:1.5px solid var(--muted)}
.hbar .target{position:absolute;top:-3px;bottom:-3px;border-left:1.5px dashed var(--turun)}
.dua{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.dua{grid-template-columns:minmax(0,1fr)}}
.yield{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(6px,1fr);gap:4px;align-items:end;height:190px;position:relative;padding-top:18px;min-width:max(100%,var(--lebar))}
.yield .b{background:var(--laut);border-radius:3px 3px 0 0;position:relative}
.yield .b.c{background:var(--muted)}
.yield .b span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font:500 11px/1 var(--mono);white-space:nowrap}
.yield .garis{position:absolute;left:0;right:0;border-top:1.5px dashed var(--turun);z-index:1;pointer-events:none}
.yx{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(6px,1fr);gap:4px;margin-top:6px;font:11px/1.3 var(--mono);color:var(--muted);text-align:center;min-width:max(100%,var(--lebar))}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.biaya .row{grid-template-columns:130px minmax(0,1fr) 160px}
@media (max-width:520px){.hbar .row,.biaya .row{grid-template-columns:minmax(0,1fr) auto}.hbar .trak{grid-column:1/-1;order:3}}
.langkah{list-style:none;margin:0;padding:0}
.langkah li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.langkah li:last-child{border-bottom:none}
.langkah p{margin:0;color:var(--muted);font-size:14px}
.chip{grid-row:1;grid-column:2;font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:6px 8px;border-radius:999px;align-self:start}
.chip.selesai{background:var(--laut-muda);color:var(--laut)}.chip.berjalan{background:var(--turun-muda);color:var(--turun)}
.antar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px}
.galat{background:var(--turun-muda);color:var(--turun);border-radius:10px;padding:16px 18px;font-weight:500}
.dana{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.dana div{display:flex;flex-direction:column;gap:4px;min-width:0}
.dana .k{font-size:13px;color:var(--muted)}.dana .v{font:500 20px/1.2 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:760px){.dana{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.dana{grid-template-columns:minmax(0,1fr)}}
.pakai{height:12px;background:var(--laut-muda);border-radius:3px;overflow:hidden;margin-top:16px}.pakai div{height:100%;background:var(--laut)}
footer{border-top:1px solid var(--line);padding-top:18px;font-size:13px;color:var(--muted)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px}
.topbar button{color:#fff;border-color:rgba(255,255,255,.5)}
.button,button{font:500 14px/1.3 var(--sans);border:1px solid var(--laut);background:var(--laut);color:#fff;border-radius:7px;padding:9px 14px;cursor:pointer}
.button.secondary,button.secondary{background:transparent;color:var(--laut)}
button:disabled{opacity:.55;cursor:wait}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--laut);outline-offset:2px}
.login{max-width:420px;margin:32px auto 0;width:100%}
.form{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:9px 10px;font:inherit;font-weight:400}
.field textarea{min-height:72px;resize:vertical}
.grid-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.entry{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:10px;align-items:end;padding:12px 0;border-top:1px solid var(--line)}
.entry.biaya-entry{grid-template-columns:repeat(2,minmax(0,1fr)) auto}
.entry.langkah-entry{grid-template-columns:repeat(2,minmax(0,1fr)) 120px auto}
.entry button{height:39px}
.form-section{display:flex;flex-direction:column;gap:10px}
.form-section h3{margin:0;font-size:17px}
.form-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface)}
@media(max-width:700px){.entry,.entry.biaya-entry,.entry.langkah-entry{grid-template-columns:repeat(2,minmax(0,1fr))}.entry button{grid-column:1/-1}.grid-form{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="pita"><div class="pita-isi">
  <div class="topbar"><img src="logo-putih.png" alt="PT. Katalis Lintas Global"><button id="logout" class="secondary" type="button" hidden>Keluar</button></div>
  <nav id="nav" aria-label="Siklus"></nav>
  <p class="label" id="label"></p>
  <h1 id="judul"></h1>
  <p class="lead" id="lead"></p>
</div></header>
<main id="isi"></main>

<script src="hitung.js"></script>
<script>
const H = window.Hitung;
const state = { role: null, overview: null, cycles: [] };
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const tgl = (d) => d ? new Date(d + "T00:00:00+07:00").toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric", timeZone: "Asia/Jakarta" }) : "—";
const kelasLaba = (n) => (n < 0 ? "turun" : "naik");
const $ = (id) => document.getElementById(id);

function kpi(items) {
  return `<div class="kpi">${items.map(([k, v, s, c = ""]) =>
    `<div><span class="k">${k}</span><span class="v ${c}">${v}</span><span class="s">${s}</span></div>`).join("")}</div>`;
}

// Batang mendatar bertanda: nol selalu tergambar, nilai negatif ke kiri.
function batang(items, { format, target } = {}) {
  const vals = items.map((i) => i.v ?? 0).concat(target ?? 0, 0);
  const lo = Math.min(...vals), hi = Math.max(...vals), rentang = hi - lo || 1;
  const pos = (v) => ((v - lo) / rentang) * 100;
  return `<div class="hbar">${items.map((i) => {
    const v = i.v;
    const bar = v == null ? "" : `<div class="isi ${v < 0 ? "neg" : ""}" style="left:${pos(Math.min(0, v))}%;width:${Math.abs(pos(v) - pos(0))}%"></div>`;
    return `<div class="row"><span>${esc(i.label)}</span><div class="trak">${bar}<div class="nol" style="left:${pos(0)}%"></div>${target != null ? `<div class="target" style="left:${pos(target)}%"></div>` : ""}</div><span class="r">${format(v)}</span></div>`;
  }).join("")}</div>`;
}

function nav(daftar, aktif) {
  $("nav").innerHTML = [`<a href="#ringkasan" ${aktif === "ringkasan" ? 'aria-current="page"' : ""}>Ringkasan</a>`]
    .concat(state.role === "admin" ? daftar.map((s) => `<a href="#siklus-${s.no}" ${aktif === s.no ? 'aria-current="page"' : ""}>Siklus ${s.no}</a>`).concat(`<a href="#baru" ${aktif === "baru" ? 'aria-current="page"' : ""}>+ Siklus baru</a>`) : []).join("");
}

function kaki() {
  return window.CATATAN_KAKI ? `<footer>${esc(window.CATATAN_KAKI)}</footer>` : "";
}

function bagianDana(dana, daftar) {
  const p = H.posisiDana(dana, daftar);
  if (!p) return "";
  const porsi = Math.min(1, p.terpakai / p.diterima);
  return `<section><p class="eyebrow">Dana investor</p><h2>Sisa dana ${H.rp(p.sisa)} dari ${H.rp(p.diterima)} yang diterima</h2>
    <div class="panel">
      <div class="dana">
        <div><span class="k">Dana diterima</span><span class="v">${H.rpRingkas(p.diterima)}</span></div>
        <div><span class="k">Terpakai untuk biaya produksi</span><span class="v">${H.rpRingkas(p.terpakai)}</span></div>
        <div><span class="k">Kembali dari penjualan</span><span class="v">${H.rpRingkas(p.kembali)}</span></div>
        <div><span class="k">Imbal hasil terhadap dana</span><span class="v ${kelasLaba(p.sisa - p.diterima)}">${H.persen(p.imbal, 2)}</span></div>
      </div>
      <div class="pakai" title="Biaya produksi ${H.persen(porsi, 1)} dari dana"><div style="width:${porsi * 100}%"></div></div>
      <p class="muted" style="margin:8px 0 0;font-size:13px">Biaya produksi semua siklus = ${H.persen(porsi, 1)} dari dana yang diterima.</p>
      ${dana.length > 1 ? `<div class="gulir" style="margin-top:14px"><table><thead><tr><th>Tanggal</th><th>Keterangan</th><th class="r">Jumlah</th></tr></thead><tbody>${dana.map((x) => `<tr><td>${tgl(x.tanggal)}</td><td>${esc(x.keterangan || "")}</td><td class="r">${H.rp(x.jumlah)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted" style="margin:6px 0 0;font-size:13px">Diterima ${tgl(dana[0].tanggal)}${dana[0].keterangan ? ` · ${esc(dana[0].keterangan)}` : ""}.</p>`}
      <p class="muted" style="margin:12px 0 0;font-size:13px">Sisa dana dihitung dengan anggapan seluruh penjualan sudah dibayar dan seluruh biaya sudah dilunasi; biaya di luar siklus produksi (gaji kantor, sewa, aset) belum termasuk.</p>
    </div>
  </section>`;
}

function ringkasan(data) {
  const t = data.total, daftar = data.rows;
  $("label").textContent = `Ringkasan · ${t.siklus} siklus produksi`;
  $("judul").textContent = t.siklus ? `${H.kg(t.kgLoin)} loin dari ${t.siklus} siklus, ${t.laba < 0 ? "rugi" : "laba"} ${H.rp(Math.abs(t.laba))}` : "Belum ada siklus produksi";
  $("lead").textContent = t.siklus ? `Periode ${tgl(daftar[0].produksi)} sampai ${tgl(daftar[daftar.length - 1].produksi)}.${state.role === "admin" ? " Klik satu siklus untuk rinciannya." : ""}` : "Data siklus pertama belum dimasukkan.";
  if (!t.siklus) return `<div class="notice" style="margin-top:24px">${state.role === "admin" ? 'Mulai dengan <a href="#baru">menambah siklus pertama</a>.' : "Admin belum memasukkan data produksi."}</div>` + kaki();
  const baris = daftar.map((s) => ({ s, r: s.summary }));
  return kpi([
    ["Ikan utuh diterima", H.kg(t.kgIkan, 0), `${t.ekor} ekor`],
    ["Loin dihasilkan", H.kg(t.kgLoin), `Yield ${H.persen(t.yield)}`],
    ["Pendapatan", H.rpRingkas(t.pendapatan), `Biaya ${H.rpRingkas(t.biaya)}`],
    [t.laba < 0 ? "Rugi" : "Laba", H.rpRingkas(t.laba), `Margin ${H.persen(t.margin)}`, kelasLaba(t.laba)],
  ]) + `
  <section><p class="eyebrow">Per siklus</p><h2>Yield dan margin tiap siklus</h2>
    <div class="dua">
      <div class="panel"><p class="muted" style="margin:0 0 10px">Yield (garis putus = rencana 60 %)</p>${batang(baris.map(({ s, r }) => ({ label: `Siklus ${s.no}`, v: r.yield })), { format: H.persen, target: 0.6 })}</div>
      <div class="panel"><p class="muted" style="margin:0 0 10px">Margin laba</p>${batang(baris.map(({ s, r }) => ({ label: `Siklus ${s.no}`, v: r.margin })), { format: H.persen })}</div>
    </div>
  </section>
  <section><p class="eyebrow">Daftar siklus</p><h2>Semua siklus produksi</h2>
    <div class="panel gulir"><table>
      <thead><tr><th>Siklus</th><th>Produksi</th><th>Pembeli</th><th class="r">Ikan</th><th class="r">Loin</th><th class="r">Yield</th><th class="r">Pendapatan</th><th class="r">Laba</th><th class="r">Margin</th></tr></thead>
      <tbody>${baris.map(({ s, r }) => `<tr><td>${state.role === "admin" ? `<a href="#siklus-${s.no}">Siklus ${s.no}</a>` : `Siklus ${s.no}`}</td><td>${tgl(s.produksi)}</td><td>${esc(s.pembeli)}</td><td class="r">${H.kg(r.kgIkan, 0)}</td><td class="r">${H.kg(r.kgLoin)}</td><td class="r">${H.persen(r.yield)}</td><td class="r">${H.rp(r.pendapatan)}</td><td class="r ${r.laba < 0 ? "turun" : ""}">${H.rp(r.laba)}</td><td class="r">${H.persen(r.margin)}</td></tr>`).join("")}
      <tr class="total"><td colspan="3">Total</td><td class="r">${H.kg(t.kgIkan, 0)}</td><td class="r">${H.kg(t.kgLoin)}</td><td class="r">${H.persen(t.yield)}</td><td class="r">${H.rp(t.pendapatan)}</td><td class="r ${t.laba < 0 ? "turun" : ""}">${H.rp(t.laba)}</td><td class="r">${H.persen(t.margin)}</td></tr>
      </tbody></table></div>
  </section>` + kaki();
}

function grafikEkor(s) {
  const MAX = 0.8, ramai = s.ekor.length > 20;
  const bars = s.ekor.map((e) => {
    const y = e.loinKg / e.kg;
    return `<div class="b ${/^C/i.test(e.grade) ? "c" : ""}" style="height:${(Math.min(y, MAX) / MAX) * 100}%" title="Tag ${esc(e.tag)}: ${H.kg(e.kg, 0)}, yield ${H.persen(y)}, grade ${esc(e.grade)}">${ramai ? "" : `<span>${H.persen(y).replace(" %", "")}</span>`}</div>`;
  }).join("");
  const label = ramai ? "" : `<div class="yx">${s.ekor.map((e) => `<div>${esc(e.tag)}<br>${H.kg(e.kg, 0)}</div>`).join("")}</div>`;
  const lebar = `--lebar:${s.ekor.length * 10}px`;
  return `<div class="gulir"><div class="yield" style="${lebar}"><div class="garis" style="bottom:${(0.6 / MAX) * 172}px"></div>${bars}</div>${label.replace('class="yx"', `class="yx" style="${lebar}"`)}</div>
    <div class="legend"><span><i style="background:var(--laut)"></i>Grade A/B</span><span><i style="background:var(--muted)"></i>Grade C</span><span><i style="background:var(--turun)"></i>Rencana 60 %</span></div>`;
}

function detail(daftar, s) {
  const r = H.ringkasSiklus(s), i = daftar.indexOf(s), seb = daftar[i - 1], ses = daftar[i + 1];
  $("label").textContent = `Siklus ${s.no} · produksi ${tgl(s.produksi)}${s.kirim ? ` · kirim ${tgl(s.kirim)}` : ""}`;
  $("judul").textContent = `Siklus ${s.no}: yield ${H.persen(r.yield)}, ${r.laba < 0 ? "rugi" : "laba"} ${H.rp(Math.abs(r.laba))}`;
  $("lead").textContent = `${r.ekor} ekor tuna menjadi ${H.kg(r.kgLoin)} loin untuk ${s.pembeli}.`;
  const totalBiaya = r.biaya || 1;
  return kpi([
    ["Ikan utuh diterima", H.kg(r.kgIkan, 0), `${r.ekor} ekor`],
    ["Loin dihasilkan", H.kg(r.kgLoin), `Yield ${H.persen(r.yield)}`],
    ["Pendapatan", H.rpRingkas(r.pendapatan), r.hargaRataLoin == null ? "—" : `Rata-rata loin ${H.rp(Math.round(r.hargaRataLoin))}/kg`],
    [r.laba < 0 ? "Rugi" : "Laba", H.rpRingkas(r.laba), `Margin ${H.persen(r.margin)}`, kelasLaba(r.laba)],
  ]) + `
  <section><p class="eyebrow">Produksi</p><h2>Yield per ekor</h2>
    <div class="panel">${s.ekor.length ? grafikEkor(s) : '<p class="muted" style="margin:0">Belum ada ekor yang dicatat.</p>'}</div>
  </section>
  <section><p class="eyebrow">Hasil keuangan</p><h2>Pendapatan dan biaya</h2>
    <div class="panel gulir"><table>
      <thead><tr><th>Pos</th><th class="r">Hitungan</th><th class="r">Rp</th></tr></thead>
      <tbody>
        ${s.penjualan.map((p) => `<tr><td>${esc(p.nama)}</td><td class="r">${H.kg(p.kg)} × ${p.harga.toLocaleString("id-ID")}</td><td class="r">${Math.round(p.kg * p.harga).toLocaleString("id-ID")}</td></tr>`).join("")}
        <tr class="total"><td>Pendapatan</td><td></td><td class="r">${r.pendapatan.toLocaleString("id-ID")}</td></tr>
        ${s.biaya.map((b) => `<tr><td>${esc(b.nama)}</td><td></td><td class="r">${b.rp.toLocaleString("id-ID")}</td></tr>`).join("")}
        <tr class="total"><td>Biaya</td><td class="r">${r.hppPerKgLoin == null ? "" : `${H.rp(Math.round(r.hppPerKgLoin))}/kg loin`}</td><td class="r">${r.biaya.toLocaleString("id-ID")}</td></tr>
        <tr class="total"><td>${r.laba < 0 ? "Rugi" : "Laba"}</td><td class="r">margin ${H.persen(r.margin)}</td><td class="r ${r.laba < 0 ? "turun" : ""}">${H.rp(r.laba).replace("Rp ", "")}</td></tr>
      </tbody></table></div>
  </section>
  <section><p class="eyebrow">Struktur biaya</p><h2>Ke mana biayanya pergi</h2>
    <div class="panel biaya">${batang(s.biaya.map((b) => ({ label: b.nama, v: b.rp / totalBiaya })), { format: (v) => H.persen(v) })}</div>
  </section>
  ${s.langkah.length ? `<section><p class="eyebrow">Langkah berikutnya</p><h2>Tindak lanjut</h2>
    <div class="panel"><ul class="langkah">${s.langkah.map((l) => `<li><b>${esc(l.judul)}</b><span class="chip ${l.status}">${l.status}</span>${l.isi ? `<p>${esc(l.isi)}</p>` : ""}</li>`).join("")}</ul></div>
  </section>` : ""}
  <div class="antar">${seb ? `<a href="#siklus-${seb.no}">← Siklus ${seb.no}</a>` : "<span></span>"}<a href="#ringkasan">Ringkasan</a>${ses ? `<a href="#siklus-${ses.no}">Siklus ${ses.no} →</a>` : "<span></span>"}</div>` + kaki();
}

function rowFields(kind) {
  const field = (label, name, type = "text", extra = "") => `<label class="field">${label}<input data-field="${name}" type="${type}" ${extra}></label>`;
  if (kind === "ekor") return field("Tag", "tag", "text", "required maxlength=40") + field("Ikan (kg)", "kg", "number", "required min=0.01 step=any") + field("Loin (kg)", "loinKg", "number", "required min=0 step=any") + field("Grade", "grade", "text", "required maxlength=40");
  if (kind === "penjualan") return field("Produk", "nama", "text", "required maxlength=160") + field("Berat (kg)", "kg", "number", "required min=0.01 step=any") + field("Harga / kg (Rp)", "harga", "number", "required min=0 step=1");
  if (kind === "biaya") return field("Pos biaya", "nama", "text", "required maxlength=160") + field("Jumlah (Rp)", "rp", "number", "required min=0 step=1");
  return field("Tindak lanjut", "judul", "text", "required maxlength=160") + field("Keterangan", "isi", "text", "maxlength=500") + `<label class="field">Status<select data-field="status"><option value="berjalan">Berjalan</option><option value="selesai">Selesai</option></select></label>`;
}

function addRow(kind) {
  const row = document.createElement("div");
  row.className = `entry ${kind === "biaya" ? "biaya-entry" : kind === "langkah" ? "langkah-entry" : ""}`;
  row.innerHTML = rowFields(kind) + `<button type="button" class="secondary remove-row" aria-label="Hapus baris">Hapus</button>`;
  $(`${kind}-rows`).append(row);
}

function sectionForm(kind, title) {
  return `<div class="panel form-section"><h3>${title}</h3><div id="${kind}-rows"></div><div><button type="button" class="secondary add-row" data-kind="${kind}">+ Tambah ${title.toLowerCase()}</button></div></div>`;
}

function formBaru() {
  $("label").textContent = "Admin · entri produksi";
  $("judul").textContent = "Tambah siklus baru";
  $("lead").textContent = "Isi catatan produksi, penjualan, dan biaya. Nomor siklus diberikan otomatis saat disimpan.";
  $("isi").innerHTML = `<form id="form-siklus" class="form" style="padding-top:24px">
    <div class="panel grid-form">
      <label class="field">Tanggal produksi<input name="produksi" type="date" required></label>
      <label class="field">Tanggal kirim<input name="kirim" type="date"></label>
      <label class="field">Pembeli<input name="pembeli" type="text" required maxlength="160"></label>
    </div>
    ${sectionForm("ekor", "Ekor ikan")}
    ${sectionForm("penjualan", "Penjualan")}
    ${sectionForm("biaya", "Biaya")}
    ${sectionForm("langkah", "Tindak lanjut")}
    <div class="form-actions"><button id="save-cycle" type="submit">Simpan siklus</button><span id="form-status" role="status"></span></div>
  </form>`;
  for (const kind of ["ekor", "penjualan", "biaya"]) addRow(kind);
  $("form-siklus").addEventListener("click", (event) => {
    const add = event.target.closest(".add-row");
    if (add) addRow(add.dataset.kind);
    const remove = event.target.closest(".remove-row");
    if (remove) remove.closest(".entry").remove();
  });
  $("form-siklus").addEventListener("submit", saveCycle);
}

function readRows(kind) {
  return [...document.querySelectorAll(`#${kind}-rows .entry`)].map((row) => {
    const item = {};
    for (const input of row.querySelectorAll("[data-field]")) {
      item[input.dataset.field] = input.type === "number" ? Number(input.value) : input.value.trim();
    }
    return item;
  });
}

async function request(path, options) {
  const response = await fetch(path, { credentials: "same-origin", ...options });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    const error = new Error(data.error || "Permintaan gagal. Coba lagi.");
    error.status = response.status;
    throw error;
  }
  return data;
}

async function loadData() {
  const [overview, cycles] = await Promise.all([
    request("/api/overview"),
    state.role === "admin" ? request("/api/cycles") : Promise.resolve({ cycles: [] }),
  ]);
  state.overview = overview;
  state.cycles = cycles.cycles;
  tampil();
}

async function saveCycle(event) {
  event.preventDefault();
  const form = event.currentTarget;
  const status = $("form-status"), button = $("save-cycle");
  let created = false;
  const data = {
    produksi: form.elements.produksi.value,
    kirim: form.elements.kirim.value,
    pembeli: form.elements.pembeli.value.trim(),
    ekor: readRows("ekor"),
    penjualan: readRows("penjualan"),
    biaya: readRows("biaya"),
    langkah: readRows("langkah"),
  };
  try {
    H.periksa([{ ...data, no: 1 }]);
    button.disabled = true;
    status.textContent = "Menyimpan…";
    const saved = await request("/api/cycles", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
    created = true;
    await loadData();
    location.hash = `siklus-${saved.no}`;
    tampil();
  } catch (error) {
    status.textContent = created ? "Siklus sudah tersimpan, tetapi tampilan belum dapat diperbarui. Muat ulang halaman untuk melihatnya." : error.message;
    status.className = "turun";
  } finally { if (!created) button.disabled = false; }
}

function loginView(message = "") {
  state.role = null;
  $("logout").hidden = true;
  $("nav").innerHTML = "";
  $("label").textContent = "Akses pegawai";
  $("judul").textContent = "Overview produksi";
  $("lead").textContent = "Masuk dengan akun owner atau admin untuk melihat data yang sesuai dengan peran Anda.";
  $("isi").innerHTML = `<form id="login-form" class="panel login form">
    <h2>Masuk</h2>
    <label class="field">Nama pengguna<input name="username" autocomplete="username" required></label>
    <label class="field">Kata sandi<input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Masuk</button><p id="login-error" class="turun" role="alert" style="margin:0">${esc(message)}</p>
  </form>`;
  $("login-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const form = event.currentTarget, button = form.querySelector("button");
    button.disabled = true;
    $("login-error").textContent = "";
    try {
      const result = await request("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: form.elements.username.value, password: form.elements.password.value }) });
      state.role = result.role;
      $("logout").hidden = false;
      await loadData();
    } catch (error) { $("login-error").textContent = error.message; }
    finally { button.disabled = false; }
  });
}

function tampil() {
  if (!state.role || !state.overview) return;
  const m = /^#siklus-(\d+)$/.exec(location.hash);
  const s = state.role === "admin" && m && state.cycles.find((x) => x.no === Number(m[1]));
  const baru = state.role === "admin" && location.hash === "#baru";
  nav(state.cycles, baru ? "baru" : s ? s.no : "ringkasan");
  try {
    if (baru) formBaru();
    else $("isi").innerHTML = s ? detail(state.cycles, s) : ringkasan(state.overview);
  } catch (error) {
    $("judul").textContent = "Laman tidak bisa ditampilkan";
    $("isi").innerHTML = `<div class="galat" style="margin-top:24px">${esc(error.message)}</div>`;
  }
  document.title = (baru ? "Tambah siklus" : s ? `Siklus ${s.no}` : "Ringkasan") + " · PT. Katalis Lintas Global";
  window.scrollTo(0, 0);
}

$("logout").addEventListener("click", async () => {
  try { await request("/api/logout", { method: "POST" }); }
  finally { state.overview = null; state.cycles = []; location.hash = "ringkasan"; loginView(); }
});
addEventListener("hashchange", tampil);
request("/api/me").then(async ({ role }) => {
  state.role = role;
  $("logout").hidden = false;
  try { await loadData(); }
  catch (error) { if (error.status === 401) loginView(); else $("isi").innerHTML = `<div class="galat" style="margin-top:24px">${esc(error.message)}</div>`; }
}).catch(() => loginView());
</script>
</body>
</html>
